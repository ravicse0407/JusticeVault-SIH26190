version: '3.8'

services:
  justicevault-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: justicevault-api
    restart: always
    environment:
      - JUSTICEVAULT_SECRET=production-sih26190-master-key-genx-2026
      - DATABASE_URL=postgresql://postgres:justicevault2026@postgres:5432/justicevault_db
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_BUCKET_NAME=justicevault-evidence
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin123
      - BLOCKCHAIN_MODE=MOCK_FABRIC_ADAPTER
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      - postgres
      - minio

  postgres:
    image: postgres:15-alpine
    container_name: justicevault-postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=justicevault2026
      - POSTGRES_DB=justicevault_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d

  minio:
    image: minio/minio:latest
    container_name: justicevault-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
