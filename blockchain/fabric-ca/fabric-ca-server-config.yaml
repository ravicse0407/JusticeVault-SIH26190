# Hyperledger Fabric CA Server Config
# JusticeVault Government Identity & X.509 Authority

version: 1.5.7
port: 7054
cors:
  enabled: true
  origins:
    - "*"

debug: false
crlsizelimit: 512000

tls:
  enabled: true
  certfile: /etc/hyperledger/fabric-ca-server/tls-cert.pem
  keyfile: /etc/hyperledger/fabric-ca-server/tls-key.pem

ca:
  name: ca-justicevault-gov
  keyfile: /etc/hyperledger/fabric-ca-server/ca-key.pem
  certfile: /etc/hyperledger/fabric-ca-server/ca-cert.pem
  chainfile: /etc/hyperledger/fabric-ca-server/ca-chain.pem

registry:
  maxenrollments: -1
  identities:
    - name: admin
      pass: adminpw
      type: client
      affiliation: ""
      attrs:
        hf.Registrar.Roles: "*"
        hf.Registrar.DelegateRoles: "*"
        hf.Revoker: true
        hf.IntermediateCA: true
        hf.GenCRL: true
        hf.Registrar.Attributes: "*"
        hf.AffiliationMgr: true

affiliations:
  police:
    - hq
    - stations
  forensic:
    - cfsl
    - cyberlab
  judiciary:
    - highcourt
    - sessions
  pmo:
    - audit
    - governance

signing:
  default:
    usage:
      - digital signature
    expiry: 8760h
  profiles:
    ca:
      usage:
        - cert sign
        - crl sign
      expiry: 43800h
      caconstraint:
        isca: true
        maxpathlen: 1
